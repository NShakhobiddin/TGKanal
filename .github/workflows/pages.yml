name: Panel (GitHub Pages)

# Panel sahifasi shu repo'ning o'zidan chiqadi: https://<login>.github.io/<repo>/
# Faqat ui/index.html joylanadi — postlar, rasmlar, sozlamalar sahifaga kirmaydi.
on:
  push:
    branches: [main]
    paths: ["ui/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sahifani yig'ish
        run: |
          mkdir -p _site
          sed "s#__DATA_REPO__#${{ github.repository }}#g" ui/index.html > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
